<div class="shell">
  <as-topbar
    [status]="state.status()"
    [sidebarOpen]="sidebarOpen()"
    (sidebarToggle)="toggleSidebar()"
    (optimizationGuide)="openOptimizationGuide(optimizationGuideTemplate, $event.currentTarget)"
    (configure)="openConfiguration()"
    (pauseToggle)="state.togglePause()" />

  <mat-drawer-container class="workspace" autosize>
    <mat-drawer class="sessions" [mode]="compactLayout() ? 'over' : 'side'" [opened]="sidebarOpen()" (closedStart)="closeSidebar()">
      <as-session-sidebar
        [sessions]="visibleSessions()"
        [selectedSessionId]="selectedSessionId()"
        [selectedTurnCount]="state.selectedTurnCount()"
        [retentionDays]="state.status().retentionDays"
        [importing]="state.importing()"
        [canClear]="state.sessions().length > 0"
        [repositories]="standardizationHistory.repositories()"
        [repositoryError]="standardizationHistory.error()"
        [selectedRepositoryId]="selectedRepositoryId()"
        [selectedAnalysisId]="selectedAnalysisId()"
        (sessionSelected)="selectSession($event)"
        (newRepositoryAnalysis)="openNewRepositoryAnalysis()"
        (analysisSelected)="openSavedAnalysis($event)"
        (refreshRepositories)="standardizationHistory.refresh()"
        (fileSelected)="importSessionFile($event)"
        (clearAll)="deleteAll()" />
    </mat-drawer>

    <mat-drawer-content class="workspace-content">
      <router-outlet />
    </mat-drawer-content>
  </mat-drawer-container>
</div>

<ng-template #optimizationGuideTemplate>
  <as-optimization-guidance />
</ng-template>
<as-round-details-aside />
