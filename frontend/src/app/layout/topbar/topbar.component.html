<header class="topbar">
  <div class="brand">
    <button class="mark-toggle" type="button"
      [attr.aria-label]="sidebarOpen() ? 'Zwiń panel sesji' : 'Pokaż panel sesji'"
      [matTooltip]="sidebarOpen() ? 'Zwiń panel sesji' : 'Pokaż panel sesji'"
      matTooltipClass="scanner-info-tooltip" (click)="sidebarToggle.emit()">
      <span class="mark-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      <mat-icon aria-hidden="true">{{ sidebarOpen() ? 'left_panel_close' : 'left_panel_open' }}</mat-icon>
    </button>
    <div><strong>Agent Scanner</strong><small>LOCAL OBSERVABILITY</small></div>
  </div>
  <div class="top-actions">
    <div class="connection" [class.connected]="status().connected" [class.paused]="status().paused">
      <i></i>
      <span>{{ status().paused ? 'Nasłuchiwanie wstrzymane' : status().connected ? 'Ostatnio odebrano telemetrię' : 'Oczekiwanie na telemetrię' }}</span>
      @if (status().lastSignalAt) {<small>{{ time(status().lastSignalAt) }}</small>}
    </div>
    <button class="button guide-button ui-button" matTooltip="Katalog technik optymalizacji bez AI" matTooltipClass="scanner-info-tooltip" aria-label="Techniki optymalizacji" (click)="optimizationGuide.emit($event)"><mat-icon>lightbulb</mat-icon><span>Techniki optymalizacji</span></button>
    <button class="icon-button ui-icon-button" matTooltip="Konfiguracja połączenia" matTooltipClass="scanner-info-tooltip" aria-label="Konfiguracja połączenia" (click)="configure.emit()"><mat-icon>settings</mat-icon></button>
    <button class="button quiet ui-button" (click)="pauseToggle.emit()">{{ status().paused ? 'Wznów' : 'Pauza' }}</button>
  </div>
</header>
