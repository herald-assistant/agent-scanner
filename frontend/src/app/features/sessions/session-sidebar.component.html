<div class="session-panel">
  <div class="aside-title">
    <div><span class="eyebrow">HISTORIA</span><h2>Sesje</h2></div>
    <div class="aside-title-actions">
      <span class="count">{{ sessions().length }}</span>
      <button class="sidebar-toggle" matTooltip="Zwiń panel sesji" matTooltipClass="scanner-info-tooltip" aria-label="Zwiń panel sesji" (click)="collapse.emit()"><mat-icon>left_panel_close</mat-icon></button>
    </div>
  </div>
  @if (sessions().length) {
    <div class="session-list">
      @for (session of sessions(); track session.id) {
        <button class="session-card" [class.active]="selectedSessionId() === session.id" (click)="sessionSelected.emit(session)">
          <div class="session-head">
            <span class="source-avatar" [class.vscode]="session.sourceKind === 'vscode'"><mat-icon aria-hidden="true">{{ sourceIcon(session) }}</mat-icon></span>
            <div>
              <strong>{{ title(session) }}</strong>
              <small class="source-line"><span>{{ sourceLabel(session) }}</span>@if (sourceDetails(session); as details) {<b>·</b><span>{{ details }}</span>}</small>
            </div>
            @if (session.errorCount) {
              <span class="state bad" matTooltip="W odebranej telemetrii wystąpiły błędy.">Błędy</span>
            }
          </div>
          <div class="session-meta"><span>{{ time(session.lastSeenAt) }}</span><span>{{ model(session) }}</span><span>{{ turnCount(session) }} rund</span><span>{{ tokens(session) }} tok.</span></div>
        </button>
      }
    </div>
  } @else {
    <div class="empty-mini"><div class="pulse"></div><p>Czekam na pierwszą sesję agenta.</p></div>
  }
  <div class="session-import">
    <input #sessionImportInput type="file" accept=".json,application/json" (change)="onFileSelected($event)">
    <button type="button" (click)="sessionImportInput.click()" [disabled]="importing()">
      <mat-icon aria-hidden="true">upload_file</mat-icon>{{ importing() ? 'Importowanie…' : 'Importuj sesję JSON' }}
    </button>
  </div>
  <div class="aside-footer"><span>Retencja {{ retentionDays() }} dni</span><button (click)="clearAll.emit()" [disabled]="!canClear()">Wyczyść</button></div>
</div>
