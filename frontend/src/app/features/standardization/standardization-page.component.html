<section class="page">
  <header class="analysis-title">
    <div><span class="ui-eyebrow">REPOZYTORIA</span><h1>{{ title() }}</h1></div>
    <div class="analysis-actions">
      @if (savedAnalysis()) {
        <button class="icon-button ui-icon-button" type="button" matTooltip="Eksportuj analizę do JSON"
          matTooltipClass="scanner-info-tooltip" aria-label="Eksportuj analizę do JSON" [disabled]="deleting()"
          (click)="exportAnalysis()"><mat-icon aria-hidden="true">download</mat-icon></button>
        <button class="icon-button danger ui-icon-button ui-button--danger" type="button" matTooltip="Usuń analizę"
          matTooltipClass="scanner-info-tooltip" aria-label="Usuń analizę" [disabled]="deleting()"
          (click)="deleteAnalysis()"><mat-icon aria-hidden="true">delete</mat-icon></button>
      }
      <button class="icon-button ui-icon-button" type="button" matTooltip="Zamknij analizę"
        matTooltipClass="scanner-info-tooltip" aria-label="Zamknij analizę" [disabled]="deleting() || state.busy()"
        (click)="closeAnalysis()"><mat-icon aria-hidden="true">close</mat-icon></button>
    </div>
  </header>
  @if (loading()) { <p role="status">Ładowanie analizy…</p> }
  @else if (error()) { <p class="page-error" role="alert">{{ error() }}</p> }
  @else { <as-standardization /> }
</section>
