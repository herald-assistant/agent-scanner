name: Demo · GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Documentation and whitespace
        run: |
          node scripts/check-docs.mjs
          git diff --check
      - name: Spring regressions
        run: mvn --batch-mode -Dskip.frontend=true test
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend regressions
        working-directory: frontend
        run: npm test
      - name: Full frontend build
        working-directory: frontend
        run: npm run build
      - name: Static demo build
        working-directory: frontend
        run: |
          npm run build:demo -- --base-href "/${GITHUB_REPOSITORY#*/}/"
          node scripts/check-demo-artifact.mjs "/${GITHUB_REPOSITORY#*/}/"
      - name: Real browser acceptance
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:demo:e2e
      - name: Upload static Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/demo

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v4
